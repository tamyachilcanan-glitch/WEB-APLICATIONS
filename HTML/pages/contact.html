<!DOCTYPE html>
<html>
<head>
    <title>Contact</title>
</head>

<body>
    <h1>Contact Form</h1>

    <nav>
        <a href="../index.html">Home</a>
        <a href="courses.html">Courses</a>
        <a href="schedule.html">Schedule</a>
        <a href="other1.html">OTHER1</a>
        <a href="other2.html">OTHER2</a>
        <a href="contact.html">Contact</a>
    </nav>

    <form>
        <p>
            Name:
            <input type="text">
        </p>

        <p>
            Email:
            <input type="email">
        </p>

        <p>
            Date of birth:
            <input type="date">
        </p>


        <p>
            Semester:
            <input type="number">
        </p>

        <p>
            Reason for contact:
            <select>
                <option>Question</option>
                <option>Information</option>
                <option>Other</option>
            </select>
        </p>

        <p>
            Message:
        </p>

        <textarea rows="5" cols="30"></textarea>

        <p>
            <input type="checkbox">
            I accept the terms
        </p>

        <button type="submit">Send</button>
    </form>
</body>
</html>
